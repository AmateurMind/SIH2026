services:
  - type: web
    name: campus-placement-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --workspaces=false
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_LEGACY_JWT_AUDIENCE
        sync: false
      - key: CLERK_NEW_JWT_TEMPLATE_NAME
        sync: false
      - key: CLERK_NEW_JWT_AUDIENCE
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB3FORMS_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MENTOR_CHAT_ID
        sync: false
      - key: N8N_MENTOR_WEBHOOK_URL
        sync: false
      - key: EXTERNAL_API_KEY
        sync: false

  - type: static
    name: campus-placement-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm install --workspaces=false && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
      - key: VITE_OPENROUTER_BASE_URL
        sync: false
      - key: VITE_OPENROUTER_MODEL
        sync: false
